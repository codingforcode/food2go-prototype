<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food2Go prototype</title>
<style>body{margin:0;background:#f2f5f2;color:#18352a;font:17px system-ui}main{max-width:650px;margin:auto;padding:24px}h1{font-size:38px;margin-bottom:0}small{display:block;margin:12px 0;color:#42584c}section{background:white;border-radius:18px;padding:22px;margin:20px 0}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #809389;border-radius:8px;box-sizing:border-box}button{background:#185e42;color:white;cursor:pointer;margin:5px}input,textarea{max-width:100%}label{display:block;margin:12px 0}article{border-top:1px solid #dce3df;padding:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}textarea{width:100%}:focus-visible{outline:3px solid #c45b00;outline-offset:3px}#notice{padding:12px;background:#fff0cf}button:disabled{opacity:.5;cursor:default}</style>
<main><h1>Food2Go</h1><p>Your next good meal.</p><p id="notice" role="status">Choose a restaurant to begin.</p><section><h2>Find your food</h2><label for="search">Search restaurant or cuisine</label><input id="search" type="search" placeholder="Try pizza or green"><div id="restaurants"></div></section><section id="menu" hidden></section><section><h2>Your cart</h2><div id="cart"></div><form id="checkout"><label for="address">Delivery address (sample only)</label><input id="address" required placeholder="123 Sample Street"><p>Payment: simulated approval</p><button>Place demo order</button></form></section><section id="tracking" hidden><h2>Track your order</h2><p id="orderdetails"></p><p id="status" aria-live="polite"></p><button id="advance">Simulate next status</button><form id="feedback" hidden><h3>How was your meal?</h3><label for="rating">Rating</label><select id="rating"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Average</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select><label for="comment">Comment (optional)</label><textarea id="comment" maxlength="500"></textarea><button>Submit feedback</button></form><p id="review" role="status"></p></section></main>
<script>
const restaurants=[{name:'Green Bowl',cuisine:'Healthy',items:[['Harvest bowl',12],['Tofu salad',10]]},{name:'City Pizza',cuisine:'Italian',items:[['Margherita pizza',15],['Garden pizza',17]]},{name:'Spice Kitchen',cuisine:'Indian',items:[['Chickpea curry',13],['Vegetable biryani',14]]}];
const $=id=>document.getElementById(id);let cart=[],selected=null,owner=null,order=null;const states=['Confirmed','Preparing','Out for delivery','Delivered'];const money=n=>'$'+n.toFixed(2);function notice(t){$('notice').textContent=t}
function browse(){let q=$('search').value.trim().toLowerCase();$('restaurants').replaceChildren();restaurants.filter(r=>(r.name+' '+r.cuisine).toLowerCase().includes(q)).forEach(r=>{let a=document.createElement('article'),b=document.createElement('button');b.textContent=r.name+' · '+r.cuisine;b.onclick=()=>menu(r);a.append(b);$('restaurants').append(a)});if(!$('restaurants').children.length)$('restaurants').textContent='No restaurants match. Try another search.'}
function menu(r){selected=r;$('menu').hidden=false;$('menu').replaceChildren();let h=document.createElement('h2');h.textContent=r.name;$('menu').append(h);r.items.forEach(([name,price])=>{let a=document.createElement('article'),l=document.createElement('label'),q=document.createElement('input'),b=document.createElement('button');q.type='number';q.min=1;q.max=20;q.value=1;l.textContent=name+' · '+money(price)+' — quantity ';l.append(q);b.textContent='Add to cart';b.onclick=()=>{if(order){notice('Reload the page to start another demo order.');return}if(cart.length&&owner!==r.name){notice('Empty your cart before choosing another restaurant.');return}let quantity=Number(q.value);if(!Number.isInteger(quantity)||quantity<1||quantity>20){notice('Choose a quantity from 1 to 20.');return}owner=r.name;let line=cart.find(x=>x.name===name);if(line){if(line.qty+quantity>20){notice('Maximum 20 of each item.');return}line.qty+=quantity}else cart.push({name,price,qty:quantity});render();notice('Added '+name+'.')};a.append(l,b);$('menu').append(a)})}
function render(){$('cart').replaceChildren();cart.forEach((x,i)=>{let a=document.createElement('article'),l=document.createElement('label'),q=document.createElement('input'),b=document.createElement('button');l.textContent=x.name+' · '+money(x.price)+' each — quantity ';q.type='number';q.min=1;q.max=20;q.value=x.qty;q.disabled=!!order;q.onchange=()=>{let v=Number(q.value);if(!Number.isInteger(v)||v<1||v>20){q.value=x.qty;notice('Choose a quantity from 1 to 20.');return}x.qty=v;render()};l.append(q);b.textContent='Remove';b.disabled=!!order;b.onclick=()=>{cart.splice(i,1);render()};a.append(l,b);$('cart').append(a)});let subtotal=cart.reduce((s,x)=>s+x.price*x.qty,0),p=document.createElement('p');p.textContent=cart.length?'Subtotal '+money(subtotal)+' + delivery $3.99 = Total '+money(subtotal+3.99)+'. Demo prices; no additional tax.':'Your cart is empty.';$('cart').append(p)}
$('search').oninput=browse;$('checkout').onsubmit=e=>{e.preventDefault();if(order)return;if(!cart.length){notice('Add an item before checkout.');return}if(!$('address').value.trim()){notice('Enter a delivery address.');return}order={step:0,total:cart.reduce((s,x)=>s+x.price*x.qty,0)+3.99};$('tracking').hidden=false;$('orderdetails').textContent='Demo order F2G-001 · '+owner+' · '+money(order.total)+' · '+$('address').value.trim();$('checkout').hidden=true;render();status();notice('Demo order confirmed. No payment was charged.')};
function status(){$('status').textContent='Status: '+states[order.step];$('advance').disabled=order.step===3;$('feedback').hidden=order.step!==3}
$('advance').onclick=()=>{if(order&&order.step<3){order.step++;status()}};$('feedback').onsubmit=e=>{e.preventDefault();if(!order||order.step!==3)return;order.feedback={rating:Number($('rating').value),comment:$('comment').value.trim()};$('review').textContent='Thank you. Your '+$('rating').value+'-star feedback was recorded for this demo session.';$('feedback').hidden=true};browse();render();
</script></html>
